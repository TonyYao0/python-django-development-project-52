{% extends "base.html" %}
{% load django_bootstrap5 %}
{% load i18n %}

{% block content %}
<h1 class="my-4">{% translate "Изменение статуса" %}</h1>
<form method="post">
    {% csrf_token %}
    {% bootstrap_form form %}
    {% bootstrap_button _("Изменить") button_type="submit" button_class="btn-primary" %}
</form>
{% endblock %}
